# #######################################################################################
# █▄▄ █ █▄ █ █▀▄ █▀
# █▄█ █ █ ▀█ █▄▀ ▄█
# ГОРЯЧИЕ КЛАВИШИ: УПРАВЛЕНИЕ ВСЕМ И ВСЯ
# #######################################################################################

# Определение основной модифицирующей клавиши (Super)
$mainMod = SUPER

# Запуск терминала (Super + Enter)
bind = $mainMod, RETURN, exec, $terminal
# Открыть меню приложений (Super + Shift + W)
bind = $mainMod SHIFT, W, exec, $menu
# Открыть проводник (Super + Shift + E)
bind = $mainMod SHIFT, E, exec, $fileManager
# Открыть браузер (Super + Shift + B)
bind = $mainMod SHIFT, B, exec, $browser
# Запустить Telegram (Super + Shift + T)
bind = $mainMod SHIFT, T, exec, Telegram
# Запустить Obsidian (Super + Shift + O)
bind = $mainMod SHIFT, O, exec, flatpak run md.obsidian.Obsidian
# Запустить Rnote (Super + Shift + R)
bind = $mainMod SHIFT, R, exec, flatpak run com.github.flxzt.rnote
# Запустить музыкальный плеер G4Music (Super + Shift + M)
bind = $mainMod SHIFT, M, exec, flatpak run com.github.neithern.g4music
# Заблокировать экран (Super + Shift + L) — подхватывает текущие обои
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/lock.sh
# Выбор обоев (Super + Shift + P)
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/wallpaper.sh
# Меню питания (Super + Escape)
bind = $mainMod, Escape, exec, ~/.config/hypr/scripts/wofi/wofi-power.sh
# Режимы батареи (Super + B)
bind = $mainMod, B, exec, ~/.config/hypr/scripts/wofi/wofi-battery.sh
# Frog (распознавание текста)
bind = $mainMod SHIFT, F, exec, flatpak run com.github.tenderowl.frog
# История буфера обмена через wofi
bind = SUPER, V, exec, cliphist list | wofi -d -p "Clipboard" -W 600 -H 500 | cliphist decode | wl-copy && wtype -M ctrl v -m ctrl
# Discord 
bind = $mainMod SHIFT, D, exec, discord 
# УПРАВЛЕНИЕ ОКНАМИ
# Закрыть текущее окно (Super + Q)
bind = $mainMod, Q, killactive
# Сделать окно плавающим (Super + Space)
bind = $mainMod, SPACE, togglefloating
# Развернуть окно на весь экран (Super + F)
bind = $mainMod, F, fullscreen

# ФОКУС (Vim-навигация HJKL)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# РАБОЧИЕ СТОЛЫ (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ПЕРЕНОС ОКОН НА ВОРКСПЕЙСЫ
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# СКРИНШОТЫ
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot/$(date +'%Y-%m-%d_%H-%M-%S').png && wl-copy < ~/Pictures/screenshot/$(ls -t ~/Pictures/screenshot | head -n1)
bind = SHIFT, Print, exec, ~/.local/bin/screenrecord
bind = $mainMod, Delete, exec, pkill -SIGINT wf-recorder 2>/dev/null; notify-send "Запись остановлена"

# ВЫХОД ИЗ СИСТЕМЫ
bind = $mainMod SHIFT, Backspace, exit

# МЫШЬ (Перемещение и Ресайз)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# МУЛЬТИМЕДИА КЛАВИШИ
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
